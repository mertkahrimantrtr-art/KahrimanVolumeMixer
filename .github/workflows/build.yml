name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  APP_PROJECT: src/KahrimanVolumeMixer/KahrimanVolumeMixer.csproj

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: .NET 8 SDK kur
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Sürüm numarasını belirle
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Sürüm, uygulama projesindeki <Version> değerinden okunur (etiket varsa etiket önceliklidir).
          [xml]$proj = Get-Content "${{ env.APP_PROJECT }}"
          $v = ($proj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          if ("${{ github.ref }}" -match '^refs/tags/v(\d+\.\d+\.\d+)') { $v = $Matches[1] }
          if (-not $v) { throw "Sürüm bulunamadı" }

          # main dalına gönderilen yeni bir sürüm numarası otomatik olarak yayımlanır.
          $release = 'false'
          if ("${{ github.event_name }}" -eq 'push' -and "${{ github.ref }}" -match '^refs/heads/(main|master)$') {
            gh release view "v$v" --repo "${{ github.repository }}" *> $null
            if ($LASTEXITCODE -ne 0) { $release = 'true' }
            $global:LASTEXITCODE = 0
          }
          if ("${{ github.ref }}" -like 'refs/tags/v*') { $release = 'true' }

          "version=$v" >> $env:GITHUB_OUTPUT
          "release=$release" >> $env:GITHUB_OUTPUT
          Write-Host "Sürüm: $v  •  Yayımlanacak: $release"

      - name: Paketleri geri yükle
        run: dotnet restore KahrimanVolumeMixer.sln

      - name: Derle
        run: dotnet build KahrimanVolumeMixer.sln -c Release --no-restore

      - name: Birim testleri
        run: dotnet test KahrimanVolumeMixer.sln -c Release --no-build --verbosity normal

      - name: Tek EXE olarak yayımla (win-x64, self-contained)
        run: >
          dotnet publish ${{ env.APP_PROJECT }}
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishReadyToRun=true
          -p:DebugType=embedded
          -p:Version=${{ steps.version.outputs.version }}
          -o publish

      - name: Yayın klasörünü kontrol et
        shell: pwsh
        run: |
          Get-ChildItem publish | Format-Table Name, Length
          if (-not (Test-Path publish/KahrimanVolumeMixer.exe)) { throw "EXE üretilemedi" }
          Copy-Item publish/KahrimanVolumeMixer.exe "KahrimanVolumeMixer-v${{ steps.version.outputs.version }}-win-x64.exe"

      - name: EXE'yi artefakt olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: KahrimanVolumeMixer-win-x64
          path: KahrimanVolumeMixer-v${{ steps.version.outputs.version }}-win-x64.exe
          if-no-files-found: error

      - name: GitHub Release oluştur
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: KAHRIMAN VOLUME MIXER v${{ steps.version.outputs.version }}
          files: KahrimanVolumeMixer-v${{ steps.version.outputs.version }}-win-x64.exe
          generate_release_notes: true
          make_latest: true
